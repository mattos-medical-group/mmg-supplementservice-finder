<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Supplement Finder | Mattos Medical Group</title>
<meta name="description" content="Find the right supplement for your health concern at Mattos Medical Group — Tampa, FL. Bilingual. Regenerative medicine specialists.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;0,900;1,700&family=Source+Sans+3:ital,wght@0,300;0,400;0,600;0,700;1,300&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
:root{
  --navy:#0b1e3d;
  --navy-mid:#112847;
  --blue:#2678c0;
  --blue-light:#4a94d6;
  --white:#ffffff;
  --off-white:#f6f4ef;
  --text-body:#2d3d50;
  --text-muted:#6b7a8d;
  --border-light:#ddd8cc;
}
html{scroll-behavior:smooth;}
body{font-family:'Source Sans 3',sans-serif;background:var(--off-white);color:var(--text-body);font-size:16px;line-height:1.65;}

/* ── VITRUVIAN: fixed center, multiply blend so it shows on light AND dark ── */
.vitruvian-watermark{
  position:fixed;
  top:50%;left:50%;
  transform:translate(-50%,-50%);
  width:min(90vw,580px);
  height:min(90vw,580px);
  pointer-events:none;
  z-index:0;
}
.vitruvian-watermark img{
  width:100%;height:100%;
  object-fit:contain;
  opacity:0.08;
  mix-blend-mode:multiply;
}

.page-wrap{position:relative;z-index:1;}

/* ── LANG BAR ── */
.lang-bar{background:var(--navy);padding:9px 20px;display:flex;justify-content:space-between;align-items:center;}
.lang-bar-left{font-size:13px;color:rgba(255,255,255,0.55);letter-spacing:0.3px;}
.lang-bar-left a{color:var(--blue-light);text-decoration:none;font-weight:600;}
.lang-toggles{display:flex;gap:6px;}
.lang-btn{background:transparent;border:1px solid rgba(255,255,255,0.25);color:rgba(255,255,255,0.6);padding:4px 16px;border-radius:20px;cursor:pointer;font-size:12px;font-family:'Source Sans 3',sans-serif;letter-spacing:0.8px;transition:all 0.2s;min-height:32px;}
.lang-btn.active{background:var(--blue);border-color:var(--blue);color:var(--white);font-weight:700;}

/* ── HERO ── */
.hero{
  background:linear-gradient(160deg,var(--navy) 0%,var(--navy-mid) 60%,#0d2d52 100%);
  padding:48px 20px 60px;text-align:center;
  position:relative;
}
.hero::before{content:'';position:absolute;top:-80px;right:-80px;width:340px;height:340px;background:radial-gradient(circle,rgba(38,120,192,0.09) 0%,transparent 70%);border-radius:50%;pointer-events:none;}
.hero::after{content:'';position:absolute;bottom:-60px;left:-60px;width:280px;height:280px;background:radial-gradient(circle,rgba(74,148,214,0.08) 0%,transparent 70%);border-radius:50%;pointer-events:none;}

/* Logo: black PNG background, mix-blend-mode:screen burns out black on dark hero */
.hero-logo{
  margin:0 auto 28px;
  display:block;
  height:52px;width:auto;max-width:240px;
  mix-blend-mode:screen;
  position:relative;z-index:2;
  isolation:auto;
}
.hero-badge{
  display:inline-block;
  background:rgba(74,148,214,0.15);border:1px solid rgba(74,148,214,0.35);
  color:var(--blue-light);padding:5px 14px;border-radius:20px;
  font-size:11px;font-weight:600;letter-spacing:1.5px;text-transform:uppercase;
  margin-bottom:20px;position:relative;z-index:2;
}
.hero h1{
  font-family:'Playfair Display',serif;
  font-size:clamp(30px,7vw,52px);font-weight:900;color:var(--white);
  line-height:1.1;margin-bottom:14px;position:relative;z-index:2;
}
.hero h1 em{color:var(--blue-light);font-style:italic;display:block;}
.hero-sub{
  font-size:clamp(15px,3.5vw,17px);color:rgba(255,255,255,0.68);
  font-weight:300;line-height:1.65;max-width:560px;margin:0 auto 12px;
  position:relative;z-index:2;
}
.hero-note{display:block;font-size:12px;color:rgba(255,255,255,0.35);letter-spacing:0.3px;position:relative;z-index:2;}

/* ── TRUST BAR ── */
.trust-bar{background:var(--white);border-bottom:1px solid var(--border-light);padding:13px 16px;}
.trust-inner{max-width:880px;margin:0 auto;display:flex;justify-content:center;gap:10px 24px;flex-wrap:wrap;}
.trust-item{display:flex;align-items:center;gap:7px;font-size:12px;font-weight:600;color:var(--navy);white-space:nowrap;}
.trust-dot{width:16px;height:16px;background:var(--blue);border-radius:50%;display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:9px;color:#fff;}

/* ── MAIN ── */
.main{max-width:880px;margin:0 auto;padding:1.5rem;}

/* ── SEARCH CARD ── */
.search-card{background:var(--white);border:1px solid var(--border-light);border-radius:16px;padding:1.5rem;margin-bottom:1rem;box-shadow:0 4px 20px rgba(11,30,61,0.07);}
.search-card-label{font-size:10px;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:var(--blue);margin-bottom:10px;}
.search-wrap{position:relative;margin-bottom:1rem;}
.search-icon{position:absolute;left:14px;top:50%;transform:translateY(-50%);font-size:18px;color:var(--text-muted);pointer-events:none;}
#q{width:100%;padding:13px 14px 13px 44px;border:1.5px solid var(--blue);border-radius:12px;font-size:16px;font-family:'Source Sans 3',sans-serif;background:var(--white);color:var(--text-body);outline:none;transition:box-shadow 0.2s;}
#q:focus{box-shadow:0 0 0 3px rgba(38,120,192,0.15);}
#q::placeholder{color:#aab0ba;}
.chips-label{font-size:11px;color:var(--text-muted);font-weight:600;letter-spacing:0.5px;margin-bottom:7px;}
.chips{display:flex;flex-wrap:wrap;gap:7px;}
.chip{padding:5px 13px;border-radius:20px;font-size:12px;font-weight:600;color:var(--blue);cursor:pointer;background:rgba(38,120,192,0.07);border:1px solid rgba(38,120,192,0.2);transition:all 0.15s;user-select:none;}
.chip:hover{background:rgba(38,120,192,0.15);border-color:var(--blue);}
.chip.active{background:var(--blue);color:var(--white);border-color:var(--blue);}

/* ── FILTER BAR ── */
.filter-bar{display:flex;align-items:center;gap:8px;margin-bottom:1rem;flex-wrap:wrap;}
.filter-label{font-size:10px;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:var(--text-muted);white-space:nowrap;}
.ftab{padding:5px 14px;border-radius:20px;font-size:12px;font-weight:600;border:1px solid var(--border-light);cursor:pointer;background:var(--white);color:var(--text-muted);font-family:'Source Sans 3',sans-serif;transition:all 0.15s;}
.ftab.on{background:var(--navy);color:var(--white);border-color:var(--navy);}
.ftab:hover:not(.on){border-color:var(--blue);color:var(--blue);}

/* ── STATUS ── */
.status-bar{font-size:13px;color:var(--text-muted);margin-bottom:10px;min-height:20px;font-weight:300;}
.status-bar b{color:var(--text-body);font-weight:700;}

/* ── RESULTS ── */
.results{display:flex;flex-direction:column;gap:8px;}
.row{background:var(--white);border:1px solid var(--border-light);border-left:3px solid var(--blue);border-radius:12px;padding:16px 18px;display:grid;grid-template-columns:210px 1fr 110px;gap:14px;align-items:center;transition:all 0.2s;}
.row:hover{transform:translateY(-2px);box-shadow:0 8px 24px rgba(11,30,61,0.09);}
.row.best{border-left:4px solid var(--navy);}
.row-name{font-size:14px;font-weight:700;color:var(--navy);line-height:1.3;margin-bottom:5px;}
.line-pill{display:inline-block;font-size:10px;font-weight:700;padding:2px 9px;border-radius:20px;letter-spacing:0.3px;text-transform:uppercase;}
.line-pill.mattos{background:rgba(38,120,192,0.1);color:var(--blue);}
.line-pill.evergreen{background:rgba(22,120,60,0.1);color:#16783c;}
.line-pill.chinese{background:rgba(160,100,0,0.1);color:#8a5a00;}
.row-benefit{font-size:13px;color:var(--text-muted);line-height:1.6;font-weight:300;}
.row-tags{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px;}
.rtag{font-size:10px;padding:2px 8px;border-radius:20px;background:var(--off-white);color:var(--text-muted);border:1px solid var(--border-light);font-weight:600;}
.badge-col{text-align:right;}
.badge{display:inline-block;font-size:10px;font-weight:700;padding:4px 10px;border-radius:20px;white-space:nowrap;letter-spacing:0.5px;text-transform:uppercase;}
.badge.best{background:var(--navy);color:var(--white);}
.badge.good{background:var(--off-white);color:var(--text-muted);border:1px solid var(--border-light);}

/* ── BUNDLE ── */
.bundle{margin-top:12px;padding:16px 20px;background:linear-gradient(135deg,rgba(38,120,192,0.06) 0%,rgba(74,148,214,0.04) 100%);border:1px solid rgba(38,120,192,0.2);border-left:3px solid var(--blue);border-radius:12px;display:none;}
.bundle.show{display:block;}
.bundle-label{font-size:10px;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:var(--blue);margin-bottom:6px;}
.bundle-items{font-size:14px;font-weight:600;color:var(--navy);}
.bundle-note{font-size:12px;color:var(--text-muted);margin-top:5px;font-weight:300;}

/* ── EMPTY ── */
.empty{text-align:center;padding:3.5rem 1rem;background:var(--white);border-radius:14px;border:1px solid var(--border-light);}
.empty-icon{font-size:42px;margin-bottom:12px;opacity:0.25;}
.empty-title{font-family:'Playfair Display',serif;font-size:22px;font-weight:700;color:var(--navy);display:block;margin-bottom:8px;}
.empty-body{font-size:14px;color:var(--text-muted);font-weight:300;}

/* ── CTA ── */
.cta-section{background:linear-gradient(160deg,var(--navy) 0%,var(--navy-mid) 100%);border-radius:16px;margin-top:2rem;padding:2rem 1.5rem;text-align:center;position:relative;overflow:hidden;}
.cta-section::before{content:'';position:absolute;top:-40px;right:-40px;width:200px;height:200px;background:radial-gradient(circle,rgba(38,120,192,0.12) 0%,transparent 70%);border-radius:50%;}
.cta-eyebrow{font-size:10px;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:var(--blue-light);margin-bottom:10px;}
.cta-title{font-family:'Playfair Display',serif;font-size:clamp(20px,4vw,30px);font-weight:700;color:var(--white);margin-bottom:8px;line-height:1.2;}
.cta-title em{color:var(--blue-light);font-style:italic;}
.cta-body{font-size:14px;color:rgba(255,255,255,0.65);font-weight:300;margin:0 auto 24px;max-width:420px;}
.cta-btn{display:inline-block;background:linear-gradient(135deg,var(--blue) 0%,var(--blue-light) 100%);color:var(--white);padding:14px 32px;border-radius:50px;font-size:15px;font-weight:700;text-decoration:none;letter-spacing:0.3px;transition:all 0.3s;box-shadow:0 8px 24px rgba(38,120,192,0.4);}
.cta-btn:hover{transform:translateY(-2px);box-shadow:0 12px 32px rgba(38,120,192,0.55);}
.cta-note{font-size:12px;color:rgba(255,255,255,0.35);display:block;margin-top:8px;}

/* ── DISCLAIMER ── */
.disclaimer{max-width:880px;margin:1.5rem auto 0;padding:0 1.5rem;font-size:11px;color:var(--text-muted);font-weight:300;text-align:center;line-height:1.6;}

/* ── FOOTER ── */
footer{background:var(--navy);padding:24px 16px;text-align:center;margin-top:2rem;}
.footer-logo{height:44px;width:auto;mix-blend-mode:screen;display:block;margin:0 auto 12px;}
.footer-divider{width:40px;height:1px;background:rgba(255,255,255,0.1);margin:0 auto 12px;}
.footer-info{font-size:12px;color:rgba(255,255,255,0.38);letter-spacing:0.3px;line-height:1.8;}
.footer-info a{color:var(--blue-light);text-decoration:none;}

@media(max-width:680px){
  .row{grid-template-columns:1fr;gap:4px;padding:14px;}
  .badge-col{text-align:left;margin-top:2px;}
  .hero{padding:32px 16px 44px;}
  .main{padding:1rem;}
  .search-card{padding:1rem;}
  .filter-bar{gap:6px;}
  .ftab{padding:5px 10px;font-size:11px;}
  .cta-section{padding:1.5rem 1rem;border-radius:12px;}
  .trust-inner{gap:8px 16px;}
  .lang-bar{padding:8px 14px;}
}

/* ── SERVICE UPSELL ── */
.service-upsell{
  margin-top:14px;
  border-radius:12px;
  border:1px solid rgba(38,120,192,0.2);
  border-left:3px solid var(--blue-light);
  background:linear-gradient(135deg,rgba(11,30,61,0.03) 0%,rgba(38,120,192,0.04) 100%);
  padding:14px 18px;
  display:none;
}
.service-upsell.show{display:block;}
.service-upsell-label{
  font-size:10px;font-weight:700;letter-spacing:2px;text-transform:uppercase;
  color:var(--blue);margin-bottom:10px;
}
.service-cards{display:flex;flex-wrap:wrap;gap:8px;}
.service-card{
  display:flex;align-items:center;gap:10px;
  background:var(--white);border:1px solid var(--border-light);
  border-radius:10px;padding:10px 14px;
  flex:1;min-width:200px;
  transition:all 0.2s;cursor:default;
}
.service-card:hover{border-color:var(--blue);transform:translateY(-1px);box-shadow:0 4px 14px rgba(11,30,61,0.08);}
.service-icon{font-size:22px;flex-shrink:0;}
.service-text-wrap{}
.service-name{font-size:13px;font-weight:700;color:var(--navy);margin-bottom:2px;}
.service-desc{font-size:11px;color:var(--text-muted);font-weight:300;line-height:1.4;}
.service-cta{
  display:inline-block;margin-top:10px;
  font-size:12px;font-weight:700;color:var(--blue);
  text-decoration:none;letter-spacing:0.3px;
}
.service-cta:hover{color:var(--navy);}
@media(max-width:500px){
  .service-card{min-width:100%;}
}
</style>
</head>

function getServiceUpsell(q) {
  const lq = q.toLowerCase();
  for (const [k, v] of Object.entries(serviceMap)) {
    if (lq.includes(k.toLowerCase())) return v;
  }
  return null;
}

function renderServiceUpsell(q) {
  const T = strings[lang];
  const upsell = getServiceUpsell(q);
  const box = document.getElementById('service-upsell');
  const cards = document.getElementById('service-cards');
  const label = document.getElementById('upsell-label');
  if (!upsell || !q.trim()) { box.classList.remove('show'); return; }
  label.textContent = T.upsellLabel;
  const callText = lang === 'es' ? 'Saber más →' : 'Learn more →';
  const isPhone = s.link.startsWith('tel:');
  const targetAttr = isPhone ? '' : ' target="_blank" rel="noopener"';
  cards.innerHTML = upsell.map(s => `
    <div class="service-card">
      <div class="service-icon">${s.icon}</div>
      <div class="service-text-wrap">
        <div class="service-name">${s.name}</div>
        <div class="service-desc">${s.desc}</div>
        <a class="service-cta" href="${s.link}"${targetAttr}>${callText}</a>
      </div>
    </div>`).join('');
  box.classList.add('show');
}

function getBundle(q){const lq=q.toLowerCase();for(const[k,v]of Object.entries(bundleMap)){if(lq.includes(k.toLowerCase()))return v;}return null;}
function scoreProduct(p,q){const lq=q.toLowerCase().trim();let s=0;p.tags.forEach(t=>{if(t.includes(lq)||lq.includes(t))s+=2;});if(p.pri.some(pr=>pr.includes(lq)||lq.includes(pr)))s+=3;if(p.name.toLowerCase().includes(lq))s+=2;return s;}

/* Apply all translatable strings to DOM */
function applyStrings(T){
  document.querySelectorAll('[data-t]').forEach(el=>{
    const key=el.dataset.t;
    if(T[key]!==undefined) el.innerHTML=T[key];
  });
  document.getElementById('q').placeholder=T.placeholder||'';
  // line filter buttons
  document.querySelector('[data-line="all"]').textContent=T.lineAll;
  document.querySelector('[data-line="chinese"]').textContent=T.lineChinese;
}

function render(){
  const q=document.getElementById('q').value.trim();
  const T=strings[lang];
  const lineLabs={mattos:'Mattos Lab',evergreen:'Evergreen',chinese:lang==='es'?'Herbal Chino':'Chinese Herbal'};
  if(!q){
    document.getElementById('results').innerHTML='';
    document.getElementById('status').innerHTML='';
    document.getElementById('bundle').classList.remove('show');
    document.getElementById('service-upsell').classList.remove('show');
    document.getElementById('empty').style.display='block';
    return;
  }
  document.getElementById('empty').style.display='none';
  const scored=catalog
    .filter(p=>activeLine==='all'||p.line===activeLine)
    .map(p=>({...p,score:scoreProduct(p,q)}))
    .filter(p=>p.score>0)
    .sort((a,b)=>b.score-a.score);
  if(!scored.length){
    document.getElementById('results').innerHTML=`<div class="empty"><div class="empty-icon">🤔</div><span class="empty-title" style="font-size:17px">${T.noMatch(q)}</span></div>`;
    document.getElementById('status').innerHTML='';
    document.getElementById('bundle').classList.remove('show');
    return;
  }
  document.getElementById('status').innerHTML=T.status(scored.length,q);
  const maxScore=scored[0].score;
  document.getElementById('results').innerHTML=scored.map(p=>{
    const isTop=p.score===maxScore&&p.score>=4;
    const benefit=lang==='es'?p.es:p.en;
    return`<div class="row ${isTop?'best':''}">
      <div><div class="row-name">${p.name}</div><span class="line-pill ${p.line}">${lineLabs[p.line]}</span></div>
      <div><div class="row-benefit">${benefit}</div><div class="row-tags">${p.pri.slice(0,3).map(t=>`<span class="rtag">${t}</span>`).join('')}</div></div>
      <div class="badge-col"><span class="badge ${isTop?'best':'good'}">${isTop?T.top:T.good}</span></div>
    </div>`;
  }).join('');
  renderServiceUpsell(q);
  const bundle=getBundle(q);
  if(bundle){
    document.getElementById('bundle-label').textContent=T.bundleLabel;
    document.getElementById('bundle-items').textContent=bundle.join('  ·  ');
    document.getElementById('bundle-note').textContent=T.bundleNote;
    document.getElementById('bundle').classList.add('show');
  } else {
    document.getElementById('bundle').classList.remove('show');
  }
}

function setLang(l,btn){
  lang=l;
  document.querySelectorAll('.lang-btn').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  applyStrings(strings[l]);
  buildChips(strings[l].chips);
  render();
}

function setLine(btn){
  document.querySelectorAll('.ftab').forEach(b=>b.classList.remove('on'));
  btn.classList.add('on');
  activeLine=btn.dataset.line;
  render();
}

function buildChips(list){
  const c=document.getElementById('chips');
  c.innerHTML='';activeChip=null;
  list.forEach(chip=>{
    const el=document.createElement('span');
    el.className='chip';el.textContent=chip;
    el.onclick=()=>{
      document.querySelectorAll('.chip').forEach(ch=>ch.classList.remove('active'));
      if(activeChip===chip){activeChip=null;document.getElementById('q').value='';}
      else{activeChip=chip;el.classList.add('active');document.getElementById('q').value=chip;}
      render();
    };
    c.appendChild(el);
  });
}

document.getElementById('q').addEventListener('input',()=>{
  document.querySelectorAll('.chip').forEach(c=>c.classList.remove('active'));
  activeChip=null;render();
});

// Init — Spanish first
applyStrings(strings.es);
buildChips(strings.es.chips);
lang='es';
